<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skua Manager</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--fg:#e6e8ee;--mut:#8a91a3;--acc:#7c6cff;--hp:#e05555;--mp:#3b82f6;--tg:#e5a82a;--ok:#22c55e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px system-ui,sans-serif}
header{display:flex;gap:14px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
header b{font-size:15px}.sp{flex:1}.mut{color:var(--mut)}
button,input{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--acc)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.card.stale{opacity:.45}.hd{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-size:14px;font-weight:600}
.pill{font-size:11px;font-weight:400;padding:2px 8px;border-radius:99px;background:#16301f;color:var(--ok)}
.pill.off{background:#3a1a1a;color:var(--hp)}
.kv{display:grid;grid-template-columns:80px 1fr;gap:3px 8px;margin:10px 0}.kv span:nth-child(odd){color:var(--mut)}
.bar{position:relative;height:12px;border-radius:99px;background:#222733;margin:4px 0;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0}.bar em{position:absolute;left:6px;font:10px/12px system-ui;font-style:normal}
.row{display:flex;justify-content:space-between;background:#1d212b;border-radius:6px;padding:7px 10px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px;text-align:center}
.stats div{background:#1d212b;border-radius:6px;padding:6px 0}.stats b{display:block;font-size:15px}.stats small{color:var(--mut)}
.blur .priv{filter:blur(6px)}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px}
</style></head><body>
<header><b>Skua Manager</b><span id="sum" class="mut"></span><span class="sp"></span>
<label><input type="checkbox" id="stream" checked> Streamer mode</label>
<button id="cfg">Settings</button></header>
<div id="grid"></div>
<dialog id="dlg"><p>Relay URL (your Worker, no trailing slash)</p>
<input id="url" size="46" placeholder="https://skua-relay.you.workers.dev"><p><button id="save">Save</button></p></dialog>
<script>
// Config lives in the browser only; the key is never needed to READ.
const $ = s => document.querySelector(s);
const STALE = 180000; // 3 min: allows a 1-min webhook ping interval
const fmt = n => (n ?? 0).toLocaleString();
const pct = (a, b) => b ? Math.min(100, a / b * 100) : 0;
let url = localStorage.getItem("relay") || "";

const bar = (c, m, col, lbl) =>
  `<div class="bar"><i style="width:${pct(c, m)}%;background:${col}"></i><em>${lbl} ${fmt(c)} / ${fmt(m)}</em></div>`;

function card(b) {
  const stale = Date.now() - b.updated > STALE; // no heartbeat for 30s = offline
  const t = b.target;
  return `<div class="card ${stale ? "stale" : ""}">
  <div class="hd"><span class="priv">${b.name}</span><span class="pill ${stale ? "off" : ""}">${stale ? "Offline" : b.status ?? "Running"}</span></div>
  <div class="kv"><span>Map</span><span>${b.map ?? "-"}</span><span>Room</span><span class="priv">${b.room ?? "-"}</span>
  <span>Level</span><span>${b.level ?? "-"} - ${b.class ?? ""}</span><span>Gold</span><span class="priv">${fmt(b.gold)}</span>
  <span>AC</span><span>${fmt(b.ac)}</span><span>Inventory</span><span>${b.inv?.used ?? 0}/${b.inv?.total ?? 0}</span>
  <span>Script</span><span>${b.script ?? "-"}</span></div>
  ${bar(b.hp?.cur, b.hp?.max, "var(--hp)", "HP")}${bar(b.mp?.cur, b.mp?.max, "var(--mp)", "MP")}
  ${t ? `<div class="row"><span>Target <b>${t.name}</b></span><span>${pct(t.hp, t.max).toFixed(0)}%</span></div>${bar(t.hp, t.max, "var(--tg)", "")}` : ""}
  ${b.last ? `<div class="row"><span class="mut">Last</span><span>${b.last}</span></div>` : ""}
  ${(b.fields ?? []).map(f => `<div class="row"><span class="mut">${f.name}</span><span>${f.value}</span></div>`).join("")}
  <div class="row"><span class="mut">Quest</span><span>${b.quest ?? "-"}</span></div>
  <div class="row"><span class="mut">Equipment</span><span>${b.weapon ?? "-"}</span></div>
  <div class="stats">${[["kills","Kills"],["drops","Drops"],["quests","Quests"],["deaths","Deaths"],["relogins","Relogins"]]
    .map(([k, l]) => `<div><b>${fmt(b[k])}</b><small>${l}</small></div>`).join("")}</div></div>`;
}

async function poll() {
  if (!url) return;
  try {
    const bots = await (await fetch(url + "/bots", { cache: "no-store" })).json();
    bots.sort((a, b) => a.name.localeCompare(b.name));
    $("#grid").innerHTML = bots.map(card).join("");
    $("#sum").textContent = `${bots.filter(b => Date.now() - b.updated < STALE).length}/${bots.length} online`;
  } catch { $("#sum").textContent = "Relay unreachable"; }
}

$("#stream").onchange = e => document.body.classList.toggle("blur", e.target.checked);
document.body.classList.add("blur");
$("#cfg").onclick = () => { $("#url").value = url; $("#dlg").showModal(); };
$("#save").onclick = () => { url = $("#url").value.trim().replace(/\/$/, ""); localStorage.setItem("relay", url); $("#dlg").close(); poll(); };
if (!url) $("#dlg").showModal();
setInterval(poll, 3000); poll();
</script></body></html>
