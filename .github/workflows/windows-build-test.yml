name: Windows Build Test

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Velopack version to build (for example 0.1.1)"
        required: true
        type: string
        default: "0.1.1"

permissions:
  contents: read

concurrency:
  group: windows-build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package on Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache PyInstaller work files
        uses: actions/cache@v4
        with:
          path: |
            build-velopack/work-manager
            build-velopack/work-relay
          key: windows-pyinstaller-3.14-${{ hashFiles('dashboard_gui.py', 'relay.py') }}
          restore-keys: |
            windows-pyinstaller-3.14-

      - name: Build both apps and package with Velopack
        shell: pwsh
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: |
          if ($env:BUILD_VERSION -notmatch '^\d+\.\d+\.\d+([-.+][0-9A-Za-z.-]+)?$') {
            throw "Invalid version '$env:BUILD_VERSION'. Use a version such as 0.1.1."
          }

          .\build-velopack.ps1 -Version $env:BUILD_VERSION

      - name: Upload installer and release files
        uses: actions/upload-artifact@v4
        with:
          name: SkuaDashboard-Windows-${{ inputs.version }}
          path: Releases/*
          if-no-files-found: error
          retention-days: 14
