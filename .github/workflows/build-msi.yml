name: Build Windows MSI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          dotnet tool install --global wix --version 4.0.5

      - name: Download application icon
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/wtffidy/shit-yourself/main/SkuaIcon.ico" -OutFile "SkuaIcon.ico"

      - name: Build manager and relay
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name SkuaManager --icon SkuaIcon.ico --add-data "SkuaIcon.ico;." dashboard_gui.py
          pyinstaller --noconfirm --clean --onefile --console --name SkuaRelay --icon SkuaIcon.ico --add-data "index.html;." relay.py

      - name: Create MSI
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ("${{ github.ref_type }}" -ne "tag") { $version = "0.1.0" }
          wix build installer.wxs -d ProductVersion=$version -o "SkuaDashboard-Setup-x64.msi"

      - name: Upload MSI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkuaDashboard-Setup-x64
          path: SkuaDashboard-Setup-x64.msi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SkuaDashboard-Setup-x64.msi
          generate_release_notes: true
