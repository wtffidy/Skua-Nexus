name: Build Windows MSI

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version to publish (for example 1.0.0). Leave blank for a build-only run."
        required: false
        type: string
  push:
    branches:
      - "main"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          dotnet tool install --global wix --version 4.0.5

      - name: Download application icon
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/wtffidy/shit-yourself/main/SkuaIcon.ico" -OutFile "SkuaIcon.ico"

      - name: Build manager and relay
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name SkuaManager --icon SkuaIcon.ico --add-data "SkuaIcon.ico;." dashboard_gui.py
          pyinstaller --noconfirm --clean --onefile --console --name SkuaRelay --icon SkuaIcon.ico --add-data "index.html;." relay.py

      - name: Create MSI
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $version = $env:RELEASE_VERSION
          if ($version) {
            if ($version -notmatch "^\d+\.\d+\.\d+$") { throw "Release version must use X.Y.Z format, such as 1.0.0." }
          } elseif ($env:REF_TYPE -eq "tag") {
            $version = $env:REF_NAME.TrimStart("v")
          } else {
            $version = "0.1.0"
          }
          wix build installer.wxs -d ProductVersion=$version -o "SkuaDashboard-Setup-x64.msi"

      - name: Upload MSI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SkuaDashboard-Setup-x64
          path: SkuaDashboard-Setup-x64.msi

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_version != '' && format('v{0}', inputs.release_version) || github.ref_name }}
          target_commitish: main
          name: Skua Dashboard v${{ inputs.release_version != '' && inputs.release_version || github.ref_name }}
          files: SkuaDashboard-Setup-x64.msi
          generate_release_notes: true
