<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skua Manager</title>
<style>
:root{--bg:#0d0e12;--card:#14161c;--in:#1b1e26;--line:#262a35;--fg:#e8eaf0;--mut:#8b93a5;--acc:#7c6cff;--hp:#e05555;--mp:#3b82f6;--tg:#e5a82a;--ok:#22c55e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:13px system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:14px 22px}
.logo{background:var(--acc);border-radius:6px;width:24px;height:24px;display:grid;place-items:center;font-weight:700}
header b{font-size:15px}.dot{color:var(--ok)}.mut{color:var(--mut)}.sp{flex:1}
nav{display:flex;gap:26px;padding:0 22px;border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
nav a{padding:13px 0;color:var(--mut);cursor:pointer}nav a.on{color:var(--fg);border-bottom:2px solid var(--acc)}
button,input[type=text]{background:var(--in);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:inherit}
button{cursor:pointer}button:hover{border-color:var(--acc)}button.p{background:var(--acc);border-color:var(--acc)}
.bar-top{display:flex;gap:8px;align-items:center;padding:18px 22px 0;max-width:1700px;margin:auto}
.bar-top b{margin-right:8px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;padding:18px 22px;max-width:1700px;margin:auto}
#grid.list{grid-template-columns:1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card.stale{opacity:.5}.card.sel{border-color:var(--acc)}
.hd{display:flex;gap:8px;align-items:center;font-size:15px;font-weight:600}
.x{margin-left:auto;padding:2px 8px;color:var(--mut)}.x:hover{color:var(--hp);border-color:var(--hp)}
.tab{font:11px system-ui;font-weight:400;color:var(--mut);background:var(--in);padding:2px 7px;border-radius:4px}
.pill{display:inline-block;margin:8px 0 12px;font-size:11px;padding:2px 9px;border-radius:99px;background:#12301d;color:var(--ok);border:1px solid #1d4a2c}
.pill.off{background:#3a1a1a;color:var(--hp);border-color:#5a2a2a}
.kv{display:grid;grid-template-columns:70px 1fr;gap:5px 8px}.kv span:nth-child(odd){color:var(--mut)}
.bar{position:relative;height:12px;border-radius:99px;background:#222733;margin:4px 0;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0}.bar em{position:absolute;left:7px;font:10px/12px system-ui;font-style:normal}
.tgt{background:var(--in);border-radius:8px;padding:10px;margin:12px 0}
.tgt .t{display:flex;justify-content:space-between;margin-bottom:4px}.tgt .t span{color:var(--mut)}.tgt .t b{margin-left:6px;color:var(--fg)}
.chip{display:inline-block;border:1px solid var(--tg);color:var(--fg);border-radius:99px;padding:1px 8px;font-size:11px;margin-top:2px}
details{background:var(--in);border-radius:7px;margin-top:6px}
summary{display:flex;justify-content:space-between;padding:9px 12px;cursor:pointer;list-style:none}
summary::before{content:"\203A";margin-right:8px;color:var(--mut)}details[open] summary::before{content:"\2304"}
summary span{flex:1}summary small{color:var(--mut);font-size:12px}
.body{padding:2px 12px 10px;color:var(--mut)}.body div{display:flex;justify-content:space-between;padding:2px 0}.body b{color:var(--fg);font-weight:400}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px;text-align:center}
.stats div{background:var(--in);border-radius:7px;padding:7px 0}.stats b{display:block;font-size:15px}.stats small{color:var(--mut);font-size:11px}
.ft{margin-top:10px;color:var(--mut);font-size:12px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:500}
.blur .priv{filter:blur(6px)}
dialog{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:10px}
</style></head><body>
<header><div class="logo">V</div><b>Skua Manager</b><span id="sum" class="mut"></span><span class="sp"></span>
<label><input type="checkbox" id="stream" checked> Streamer mode</label><button id="cfg">Settings</button></header>
<nav><a class="on" data-t="bots">Bots</a><a data-t="scripts">Scripts</a><a data-t="accounts">Accounts</a><a data-t="resources">Resources</a></nav>
<div class="bar-top"><b>Army</b><input type="text" id="q" placeholder="Filter bots..."><button id="all">Select all</button>
<span class="sp"></span><button id="view">Grid View</button></div>
<div id="grid"></div>
<dialog id="dlg"><p>Relay URL (default is the local relay.py)</p>
<input type="text" id="url" size="48" placeholder="https://something.workers.dev"><p>Read key (only for the Cloudflare relay, otherwise leave empty)</p><input type="text" id="rkin" size="48" placeholder="your READ_KEY secret"><p><button class="p" id="save">Save</button></p></dialog>
<script>
// Display-only: data comes from whatever the client's webhook sends via the relay.
const $ = s => document.querySelector(s);
const STALE = 180000; // 3 min offline cutoff (works with a 1-min ping interval)
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => (n ?? 0).toLocaleString();
const pct = (a, b) => b ? Math.min(100, a / b * 100) : 0;
let url = localStorage.getItem("relay") || (location.protocol === "http:" ? location.origin : "http://localhost:8787"), rk = localStorage.getItem("rk") || "", bots = [], picked = new Set();

const bar = (c, m, col, lbl) => `<div class="bar"><i style="width:${pct(c, m)}%;background:${col}"></i><em>${lbl} ${fmt(c)} / ${fmt(m)}</em></div>`;
const sec = (title, val, rows) => `<details><summary><span>${title}</span><small>${esc(val)}</small></summary><div class="body">${rows || "<div>No data</div>"}</div></details>`;
const rows = f => (f ?? []).map(x => `<div>${esc(x.name)}<b>${esc(x.value)}</b></div>`).join("");

function card(b, i) {
  const stale = Date.now() - b.updated > STALE, t = b.target, on = picked.has(b.name);
  return `<div class="card ${stale ? "stale" : ""} ${on ? "sel" : ""}">
  <div class="hd"><input type="checkbox" data-n="${esc(b.name)}" ${on ? "checked" : ""}><span class="tab">Tab ${i + 1}</span><span class="priv">${esc(b.name)}</span><button class="x" data-del="${esc(b.name)}" title="Remove this bot">&#10005;</button></div>
  <span class="pill ${stale ? "off" : ""}">${stale ? "Offline" : esc(b.status ?? "Running")}</span>
  <div class="kv"><span>Map</span><span>${esc(b.map ?? "-")}</span><span>Room</span><span class="priv">${esc(b.room ?? "-")}</span>
  <span>Level</span><span>${esc(b.level ?? "-")}${b.class ? " - " + esc(b.class) : ""}</span><span>Gold</span><span class="priv">${fmt(b.gold)}</span>
  <span>AC</span><span>${fmt(b.ac)}</span><span>Inventory</span><span>${b.inv ? `${b.inv.used}/${b.inv.total}` : "-"}</span>
  <span>Script</span><span>${esc(b.script ?? "-")}</span></div>
  <div style="margin-top:14px">${bar(b.hp?.cur, b.hp?.max, "var(--hp)", "HP")}${bar(b.mp?.cur, b.mp?.max, "var(--mp)", "MP")}</div>
  ${t ? `<div class="tgt"><div class="t"><span>Target <b>${esc(t.name)}</b></span><span>${pct(t.hp, t.max).toFixed(0)}%</span></div>${bar(t.hp, t.max, "var(--tg)", "")}<span class="chip">${esc(t.name)}</span></div>` : ""}
  ${sec("Quest", b.quest ?? "-", "")}${sec("Equipment", b.weapon ?? "-", "")}
  ${sec("Character", "", rows(b.fields))}${sec("Log", "", b.last ? `<div>${esc(b.last)}</div>` : "")}
  <div class="stats">${[["kills","Kills"],["drops","Drops"],["quests","Quests"],["deaths","Deaths"],["relogins","Relogins"]].map(([k, l]) => `<div><b>${fmt(b[k])}</b><small>${l}</small></div>`).join("")}</div>
  ${b.skuaMem || b.gameMem ? `<div class="ft">Skua ${esc(b.skuaMem ?? "-")} &nbsp; Game ${esc(b.gameMem ?? "-")}</div>` : ""}</div>`;
}

// Table views for the other tabs, built from the same bot data
const ago = ms => { const s = Math.round((Date.now() - ms) / 1000); return s < 90 ? `${s}s ago` : s < 5400 ? `${Math.round(s / 60)}m ago` : `${Math.round(s / 3600)}h ago`; };
const TABS = {
  scripts: [["Bot", b => esc(b.name)], ["Script", b => esc(b.script ?? "-")], ["Status", b => esc(Date.now() - b.updated > STALE ? "Offline" : b.status ?? "Running")], ["Last seen", b => ago(b.updated)]],
  accounts: [["Bot", b => esc(b.name)], ["Level", b => esc(b.level ?? "-")], ["Class", b => esc(b.class ?? "-")], ["Gold", b => `<span class="priv">${fmt(b.gold)}</span>`], ["Inventory", b => b.inv ? `${b.inv.used}/${b.inv.total}` : "-"]],
  resources: [["Bot", b => esc(b.name)], ["Kills", b => fmt(b.kills)], ["Drops", b => fmt(b.drops)], ["Quests", b => fmt(b.quests)], ["Deaths", b => fmt(b.deaths)], ["Relogins", b => fmt(b.relogins)], ["Skua", b => esc(b.skuaMem ?? "-")], ["Game", b => esc(b.gameMem ?? "-")]]
};
let tab = "bots";

function render() {
  const q = $("#q").value.toLowerCase(), list = bots.filter(b => b.name.toLowerCase().includes(q));
  const cols = TABS[tab];
  $("#grid").innerHTML = cols
    ? `<div style="grid-column:1/-1"><table><tr>${cols.map(c => `<th>${c[0]}</th>`).join("")}</tr>${list.map(b => `<tr>${cols.map(c => `<td>${c[1](b)}</td>`).join("")}</tr>`).join("")}</table></div>`
    : list.map(card).join("") || `<p class="mut">No bots yet. Click Test Discord Webhook in a client.</p>`;
  const every = list.length > 0 && list.every(b => picked.has(b.name));
  $("#all").textContent = (every ? "Unselect all" : "Select all") + (picked.size ? ` (${picked.size})` : "");
  const on = bots.filter(b => Date.now() - b.updated < STALE).length;
  $("#sum").innerHTML = `<span class="dot">&#9679;</span> ${on}/${bots.length} online | ${fmt(bots.reduce((s, b) => s + (b.kills ?? 0), 0))} kills`;
}

async function poll() {
  if (!url) return;
  try {
    const r = await fetch(url + "/bots", { cache: "no-store", headers: rk ? { Authorization: `Bearer ${rk}` } : {} });
    if (r.status === 401) { $("#sum").textContent = "Wrong or missing read key (Settings)"; return; }
    bots = (await r.json()).sort((a, b) => a.name.localeCompare(b.name)); render();
  } catch { $("#sum").textContent = "Relay unreachable - is relay.py running?"; }
}

// Per-card checkbox: click handler so each box toggles only its own bot
// X button: asks the relay to forget that bot (works with the local relay.py)
$("#grid").onclick = async e => {
  const d = e.target.dataset?.del;
  if (d && confirm(`Remove ${d} from the dashboard?`)) {
    picked.delete(d);
    await fetch(`${url}/bots/${encodeURIComponent(d)}`, { method: "DELETE", headers: rk ? { Authorization: `Bearer ${rk}` } : {} }).catch(() => {});
    return poll();
  }
  const n = e.target.dataset?.n; if (!n) return; e.target.checked ? picked.add(n) : picked.delete(n); render(); };
// Select all doubles as Unselect all once every visible bot is picked
$("#all").onclick = () => {
  const names = bots.filter(b => b.name.toLowerCase().includes($("#q").value.toLowerCase())).map(b => b.name);
  const every = names.length > 0 && names.every(n => picked.has(n));
  names.forEach(n => every ? picked.delete(n) : picked.add(n)); render();
};
$("#q").oninput = render;
document.querySelectorAll("nav a").forEach(a => a.onclick = () => {
  tab = a.dataset.t; document.querySelectorAll("nav a").forEach(x => x.classList.toggle("on", x === a)); render();
});
$("#view").onclick = e => { const l = $("#grid").classList.toggle("list"); e.target.textContent = l ? "List View" : "Grid View"; };
// Streamer mode: on by default for privacy, then remembers your choice in this browser
const sm = localStorage.getItem("stream") !== "0";
$("#stream").checked = sm; document.body.classList.toggle("blur", sm);
$("#stream").onchange = e => { document.body.classList.toggle("blur", e.target.checked); localStorage.setItem("stream", e.target.checked ? "1" : "0"); };
$("#cfg").onclick = () => { $("#url").value = url; $("#rkin").value = rk; $("#dlg").showModal(); };
$("#save").onclick = () => { url = $("#url").value.trim().replace(/\/$/, ""); rk = $("#rkin").value.trim(); localStorage.setItem("relay", url); localStorage.setItem("rk", rk); $("#dlg").close(); poll(); };

setInterval(poll, 3000); poll();
</script></body></html>
