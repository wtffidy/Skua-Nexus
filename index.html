<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skua Manager</title>
<style>
:root{color-scheme:dark;--bg:#070b13;--card:rgba(15,23,38,.92);--in:#101a2a;--line:#23344b;--fg:#e6f2ff;--mut:#8297b2;--acc:#55e7ff;--acc2:#9b7bff;--hp:#ff5478;--mp:#4e9dff;--tg:#ffca67;--ok:#3ce6a0;--shadow:0 14px 36px #0005}
*{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% -10%,#143450 0,transparent 42%),radial-gradient(ellipse at 95% 0,#261d4b 0,transparent 32%),linear-gradient(180deg,#080e18,#070b13 68%);color:var(--fg);font:13px/1.5 "Segoe UI",system-ui,sans-serif;letter-spacing:.01em}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.15;background-image:linear-gradient(#3b91b6 1px,transparent 1px),linear-gradient(90deg,#3b91b6 1px,transparent 1px);background-size:38px 38px;mask-image:linear-gradient(to bottom,#000,transparent 75%);z-index:0}
header,nav,.bar-top,#grid{position:relative;z-index:1}header{display:flex;gap:12px;align-items:center;padding:18px 24px;border-bottom:1px solid #263a51;background:#080e18c9;backdrop-filter:blur(18px)}
.logo{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#06101a;border-radius:9px;width:34px;height:34px;display:grid;place-items:center;font-weight:900;font-size:17px;box-shadow:0 0 24px #55e7ff32}
header b{font-size:16px;letter-spacing:.04em}.dot{color:var(--ok);text-shadow:0 0 12px #3ce6a0}.mut{color:var(--mut)}.sp{flex:1}
#sum,#usage{font-size:11px;padding:5px 9px;border:1px solid #23384d;border-radius:7px;background:#0d1725}
nav{display:flex;gap:28px;padding:0 24px;border-bottom:1px solid var(--line);background:#0a111dce}
nav a{padding:14px 1px;color:var(--mut);cursor:pointer;font-size:12px;text-transform:uppercase;letter-spacing:.1em;transition:color .18s,border-color .18s}nav a:hover,nav a.on{color:var(--acc)}nav a.on{border-bottom:2px solid var(--acc);text-shadow:0 0 14px #55e7ff40}
button,input[type=text],input[type=password]{background:#101b2b;color:var(--fg);border:1px solid #2a3c54;border-radius:8px;padding:9px 12px;font:inherit;transition:border-color .18s,background .18s,transform .18s}
input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px #55e7ff14}
button{cursor:pointer}button:hover{border-color:var(--acc);background:#17283b}button:active{transform:translateY(1px)}button.p{background:linear-gradient(120deg,#197e9d,#6356b9);border-color:#55cce9;color:white;box-shadow:0 0 18px #55e7ff12}
.bar-top{display:flex;gap:9px;align-items:center;padding:22px 24px 0;max-width:1760px;margin:auto;flex-wrap:wrap}.bar-top>b{margin-right:5px;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:#d6e9fb}
#q{min-width:190px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;padding:18px 24px 32px;max-width:1760px;margin:auto}
#grid.list{grid-template-columns:1fr}
.card{position:relative;overflow:hidden;background:linear-gradient(145deg,rgba(17,28,45,.96),rgba(11,18,30,.96));border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);transition:border-color .2s,transform .2s,box-shadow .2s}
.card:before{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:linear-gradient(90deg,transparent,var(--acc),var(--acc2),transparent);opacity:.5}
.card:hover{border-color:#3d617a;box-shadow:0 16px 40px #0006,0 0 24px #55e7ff08;transform:translateY(-1px)}
.card.stale{opacity:.57}.card.sel{border-color:var(--acc);box-shadow:0 0 0 1px #55e7ff25,0 0 25px #55e7ff12}
.hd{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:650;min-width:0}.hd .priv{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.danger{border-color:#74364b;color:var(--hp)}button.danger:hover{background:#6a263a;color:#fff}
.x{margin-left:auto;padding:2px 8px;color:var(--mut);flex-shrink:0}.x:hover{color:var(--hp);border-color:var(--hp)}
.tab{font:10px "Segoe UI",sans-serif;font-weight:700;letter-spacing:.06em;color:#a4c6dc;background:#10283a;padding:4px 8px;border-radius:5px;border:1px solid #24445c;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:6px;margin:10px 0 13px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:#0d332b;color:var(--ok);border:1px solid #1b6957}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 9px currentColor}.pill.off{background:#351b2a;color:var(--hp);border-color:#713047}
.kv{display:grid;grid-template-columns:74px minmax(0,1fr);gap:6px 9px}.kv span:nth-child(odd){color:var(--mut)}.kv span:nth-child(even){overflow-wrap:anywhere}
.bar{position:relative;height:13px;border-radius:99px;background:#080f1b;border:1px solid #23344a;margin:6px 0;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;border-radius:99px;box-shadow:0 0 12px currentColor;transition:width .3s}.bar em{position:absolute;left:8px;font:10px/11px "Segoe UI",sans-serif;font-style:normal;color:#e9f5ff;text-shadow:0 1px 4px #000}
.tgt{background:linear-gradient(135deg,#151d2c,#111a28);border:1px solid #344056;border-radius:10px;padding:11px;margin:13px 0}
.tgt .t{display:flex;justify-content:space-between;margin-bottom:4px}.tgt .t span{color:var(--mut)}.tgt .t b{margin-left:6px;color:var(--fg)}
.chip{display:inline-block;border:1px solid #77613c;color:var(--tg);background:#302718;border-radius:99px;padding:2px 9px;font-size:10px;margin-top:3px}
details{background:#0d1624;border:1px solid #1f3045;border-radius:9px;margin-top:7px;overflow:hidden}
summary{display:flex;justify-content:space-between;padding:10px 12px;cursor:pointer;list-style:none;color:#dce9f6}summary:hover{background:#142236}
summary::before{content:"›";margin-right:9px;color:var(--acc);font-size:16px;line-height:1}details[open] summary::before{content:"⌄"}
summary span{flex:1}summary small{color:var(--mut);font-size:11px;max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.body{padding:4px 12px 11px;color:var(--mut)}.body div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid #1c2a3c}.body div:last-child{border-bottom:0}.body b{color:var(--fg);font-weight:450;text-align:right;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:13px;text-align:center}
.stats div{background:linear-gradient(145deg,#111e2e,#0d1725);border:1px solid #203149;border-radius:8px;padding:8px 2px}.stats b{display:block;font-size:16px;color:#e7f6ff;font-variant-numeric:tabular-nums}.stats small{color:var(--mut);font-size:9px;letter-spacing:.04em;text-transform:uppercase}
.ft{margin-top:11px;color:var(--mut);font-size:11px}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid #1e2c40}th{color:#a6c2d9;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;background:#101c2b}tr:last-child td{border-bottom:0}tbody tr:hover,table tr:hover td{background:#122033}
.blur .priv{filter:blur(6px);user-select:none}
dialog{background:#0e1827;color:var(--fg);border:1px solid #35506a;border-radius:14px;box-shadow:0 24px 90px #000b;padding:22px;max-width:min(92vw,520px)}dialog::backdrop{background:#02050bd9;backdrop-filter:blur(5px)}dialog input{max-width:100%}dialog p{line-height:1.7}
@media(max-width:760px){header{padding:14px;flex-wrap:wrap}#sum,#usage{order:3}nav{gap:20px;padding:0 14px;overflow-x:auto}nav a{white-space:nowrap}.bar-top{padding:16px 14px 0}.bar-top #q{flex:1;min-width:120px}#grid{grid-template-columns:1fr;padding:14px}.card{padding:14px}#stream{vertical-align:middle}header label{font-size:11px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;scroll-behavior:auto!important}}
</style></head><body>
<header><div class="logo">V</div><b>SKUA <span style="color:var(--acc)">NEXUS</span></b><span id="sum" class="mut"></span><span id="usage" class="mut">VibeSkua usage: checking…</span><span class="sp"></span>
<label><input type="checkbox" id="stream" checked> Streamer mode</label><button id="cfg">Settings</button></header>
<nav><a class="on" data-t="bots">Bots</a><a data-t="scripts">Scripts</a><a data-t="accounts">Accounts</a><a data-t="resources">Resources</a></nav>
<div class="bar-top"><b>OPERATIONS / ARMY</b><input type="text" id="q" placeholder="Filter bots..."><button id="all">Select all</button><button id="delsel" class="danger" hidden>Delete selected</button>
<span class="sp"></span><button id="view">Grid View</button></div>
<div id="grid"></div>
<dialog id="confirmDlg"><p id="confirmText">Confirm deletion?</p><p><button id="confirmCancel">Cancel</button> <button class="danger" id="confirmDelete">Delete</button></p></dialog>
<dialog id="dlg"><p>Relay URL (default is the local relay.py)</p>
<input type="text" id="url" size="48" placeholder="https://something.workers.dev"><p>Read/access key (leave empty only for localhost)</p><input type="password" id="rkin" size="48" placeholder="read_key from config.json"><p><button class="p" id="save">Save</button></p></dialog>
<script>
// Display-only: data comes from whatever the client's webhook sends via the relay.
const $ = s => document.querySelector(s);
const STALE = 180000; // 3 min offline cutoff (works with a 1-min ping interval)
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = n => (n ?? 0).toLocaleString();
const pct = (a, b) => b ? Math.min(100, a / b * 100) : 0;
let url = localStorage.getItem("relay") || (location.protocol === "http:" && location.port === "8787" ? location.origin : "http://localhost:8787"), rk = localStorage.getItem("rk") || "", bots = [], picked = new Set(), sectionOpen = new Map(), usage = null;

const bar = (c, m, col, lbl) => `<div class="bar"><i style="width:${pct(c, m)}%;background:${col}"></i><em>${lbl} ${fmt(c)} / ${fmt(m)}</em></div>`;
const sec = (botName, title, val, rows, privateBody = false) => { const key = `${botName}::${title}`; const open = sectionOpen.get(key) !== false; return `<details data-section-key="${esc(key)}" ${open ? "open" : ""}><summary><span>${title}</span><small>${esc(val)}</small></summary><div class="body ${privateBody ? "priv" : ""}">${rows || "<div>No data</div>"}</div></details>`; };
const rows = f => (f ?? []).map(x => `<div>${esc(x.name)}<b>${esc(x.value)}</b></div>`).join("");
const detailRows = value => rows(String(value ?? "").split(/\r?\n/).filter(Boolean).map((value, i) => ({ name: `#${i + 1}`, value })));
const logHtml = (message, name) => { const safe = esc(message); const safeName = esc(name); return safeName ? safe.replaceAll(safeName, `<span class="priv">${safeName}</span>`) : safe; };
const mapHtml = value => { const map = String(value ?? "-"); const match = map.match(/^(.*?)(-\d+)$/); return match ? `${esc(match[1])}<span class="priv">${esc(match[2])}</span>` : esc(map); };

function card(b, i) {
  const stale = Date.now() - b.updated > STALE, t = b.target, on = picked.has(b.name);
  return `<div class="card ${stale ? "stale" : ""} ${on ? "sel" : ""}">
  <div class="hd"><input type="checkbox" data-n="${esc(b.name)}" ${on ? "checked" : ""}><span class="tab">Tab ${i + 1}</span><span class="priv">${esc(b.name)}</span><button class="x" data-del="${esc(b.name)}" title="Remove this bot">&#10005;</button></div>
  <span class="pill ${stale || /stop|crash/i.test(b.status ?? "") ? "off" : ""}">${stale ? "Offline" : esc(b.status ?? "Running")}</span>
  <div class="kv"><span>Map</span><span>${mapHtml(b.map)}</span><span>Room</span><span class="priv">${esc(b.room ?? "-")}</span>
  <span>Level</span><span>${esc(b.level ?? "-")}${b.class ? " - " + esc(b.class) : ""}</span><span>Gold</span><span class="priv">${fmt(b.gold)}</span>
  <span>AC</span><span>${fmt(b.ac)}</span><span>Inventory</span><span>${b.inv ? `${b.inv.used}/${b.inv.total}` : b.invCount != null ? `${fmt(b.invCount)} items` : "-"}</span>
  <span>Script</span><span>${esc(b.script ?? "-")}</span></div>
  <div style="margin-top:14px">${bar(b.hp?.cur, b.hp?.max, "var(--hp)", "HP")}${bar(b.mp?.cur, b.mp?.max, "var(--mp)", "MP")}</div>
  ${t ? `<div class="tgt"><div class="t"><span>Target <b>${esc(t.name)}</b></span><span>${pct(t.hp, t.max).toFixed(0)}%</span></div>${bar(t.hp, t.max, "var(--tg)", "")}<span class="chip">${esc(t.name)}</span></div>` : ""}
  ${sec(b.name, "Quest", b.quest ?? "-", detailRows(b.quest))}${sec(b.name, "Equipment", b.weapon ?? "-", detailRows(b.weapon))}
  ${sec(b.name, "Character", "", rows(b.fields), true)}${sec(b.name, "Log", "", b.last ? `<div>${logHtml(b.last, b.name)}</div>` : "")}
  <div class="stats">${[["kills","Kills"],["drops","Drops"],["quests","Quests"],["deaths","Deaths"],["relogins","Relogins"]].map(([k, l]) => `<div><b>${fmt(b[k])}</b><small>${l}</small></div>`).join("")}</div>
  ${b.skuaMem || b.gameMem ? `<div class="ft">Skua ${esc(b.skuaMem ?? "-")} &nbsp; Game ${esc(b.gameMem ?? "-")}</div>` : ""}</div>`;
}

// Table views for the other tabs, built from the same bot data
const ago = ms => { const s = Math.round((Date.now() - ms) / 1000); return s < 90 ? `${s}s ago` : s < 5400 ? `${Math.round(s / 60)}m ago` : `${Math.round(s / 3600)}h ago`; };
const TABS = {
  scripts: [["Bot", b => esc(b.name)], ["Script", b => esc(b.script ?? "-")], ["Status", b => esc(Date.now() - b.updated > STALE ? "Offline" : b.status ?? "Running")], ["Last seen", b => ago(b.updated)]],
  accounts: [["Bot", b => esc(b.name)], ["Level", b => esc(b.level ?? "-")], ["Class", b => esc(b.class ?? "-")], ["Gold", b => `<span class="priv">${fmt(b.gold)}</span>`], ["Inventory", b => b.inv ? `${b.inv.used}/${b.inv.total}` : b.invCount != null ? `${fmt(b.invCount)} items` : "-"]],
  resources: [["Bot", b => esc(b.name)], ["Kills", b => fmt(b.kills)], ["Drops", b => fmt(b.drops)], ["Quests", b => fmt(b.quests)], ["Deaths", b => fmt(b.deaths)], ["Relogins", b => fmt(b.relogins)], ["Skua", b => esc(b.skuaMem ?? "-")], ["Game", b => esc(b.gameMem ?? "-")]]
};
let tab = "bots";

function render() {
  $("#grid").querySelectorAll("details[data-section-key]").forEach(section => { sectionOpen.set(section.dataset.sectionKey, section.open); });
  const q = $("#q").value.toLowerCase(), list = bots.filter(b => b.name.toLowerCase().includes(q));
  const cols = TABS[tab];
  $("#grid").innerHTML = cols
    ? `<div style="grid-column:1/-1"><table><tr>${cols.map(c => `<th>${c[0]}</th>`).join("")}</tr>${list.map(b => `<tr>${cols.map(c => `<td>${c[1](b)}</td>`).join("")}</tr>`).join("")}</table></div>`
    : list.map(card).join("") || `<p class="mut">No bots yet. Click Test Discord Webhook in a client.</p>`;
  const every = list.length > 0 && list.every(b => picked.has(b.name));
  $("#all").textContent = (every ? "Unselect all" : "Select all") + (picked.size ? ` (${picked.size})` : "");
  $("#delsel").hidden = !picked.size;
  $("#delsel").textContent = `Delete selected (${picked.size})`;
  const on = bots.filter(b => Date.now() - b.updated < STALE).length;
  $("#sum").innerHTML = `<span class="dot">&#9679;</span> ${on}/${bots.length} online | ${fmt(bots.reduce((s, b) => s + (b.kills ?? 0), 0))} kills`;
  if (!usage || !usage.available) {
    $("#usage").textContent = "VibeSkua process not detected";
  } else {
    const uptime = usage.uptimeSeconds == null ? "uptime —" : `up ${Math.floor(usage.uptimeSeconds / 3600)}h ${Math.floor((usage.uptimeSeconds % 3600) / 60)}m`;
    const cpu = usage.cpuPercent == null ? "CPU sampling…" : `CPU ${usage.cpuPercent.toFixed(1)}%`;
    const memory = `${(usage.memoryBytes / 1073741824).toFixed(2)} GB RAM`;
    $("#usage").textContent = `VibeSkua${usage.version ? " " + usage.version : ""} | ${uptime} | ${on} active tabs | ${cpu} | ${memory}`;
  }
}

let pollInFlight = false, ws = null, wsReconnect = null, wsConnected = false;
function connectLive() {
  let relayOrigin;
  try { relayOrigin = new URL(url, location.href); } catch { return; }
  if (location.protocol !== "http:" || relayOrigin.origin !== location.origin) return;
  if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;
  try {
    const wsUrl = url.replace(/^http:/i, "ws:").replace(/^https:/i, "wss:") + "/ws" + (rk ? "?key=" + encodeURIComponent(rk) : "");
    ws = new WebSocket(wsUrl);
    ws.onopen = () => { wsConnected = true; $("#sum").textContent = "Live connection connected"; };
    ws.onmessage = event => {
      try {
        const message = JSON.parse(event.data);
        if (message.type !== "snapshot" || !Array.isArray(message.bots)) return;
        bots = message.bots.filter(b => b && typeof b.name === "string").sort((a, b) => a.name.localeCompare(b.name));
        usage = message.usage ?? null;
        render();
      } catch { /* Ignore malformed WebSocket messages. */ }
    };
    ws.onclose = () => { wsConnected = false; ws = null; clearTimeout(wsReconnect); wsReconnect = setTimeout(connectLive, 2000); };
    ws.onerror = () => { try { ws.close(); } catch { /* Ignore a close race. */ } };
  } catch { wsConnected = false; }
}
async function poll() {
  if (!url || pollInFlight) return;
  pollInFlight = true;
  try {
    const r = await fetch(url + "/bots", { cache: "no-store", headers: rk ? { Authorization: `Bearer ${rk}` } : {} });
    if (r.status === 401) { $("#sum").textContent = "Wrong or missing read key (Settings)"; return; }
    if (!r.ok) throw new Error(`Relay returned HTTP ${r.status}`);
    const data = await r.json();
    if (!Array.isArray(data)) throw new Error("Relay returned an invalid bot list");
    bots = data.filter(b => b && typeof b.name === "string").sort((a, b) => a.name.localeCompare(b.name));
    try {
      const usageResponse = await fetch(url + "/usage", { cache: "no-store", headers: rk ? { Authorization: `Bearer ${rk}` } : {} });
      usage = usageResponse.ok ? await usageResponse.json() : null;
    } catch { usage = null; }
    render();
    connectLive();
  } catch { $("#sum").textContent = "Relay unreachable or returned invalid data - is relay.py running?"; }
  finally { pollInFlight = false; }
}

// In-page confirmation avoids browser-native confirm() behavior and popup settings.
function askDelete(message) {
  return new Promise(resolve => {
    const dialog = $("#confirmDlg");
    $("#confirmText").textContent = message;
    const finish = value => {
      dialog.close();
      $("#confirmDelete").removeEventListener("click", onDelete);
      $("#confirmCancel").removeEventListener("click", onCancel);
      dialog.removeEventListener("cancel", onCancel);
      resolve(value);
    };
    const onDelete = () => finish(true);
    const onCancel = () => finish(false);
    $("#confirmDelete").addEventListener("click", onDelete);
    $("#confirmCancel").addEventListener("click", onCancel);
    dialog.addEventListener("cancel", onCancel);
    dialog.showModal();
  });
}

// Per-card checkbox: click handler so each box toggles only its own bot.
// X button: asks the relay to forget that bot (works with the local relay.py).
$("#grid").onclick = async e => {
  const d = e.target.dataset?.del;
  if (d) {
    if (!await askDelete(`Remove ${d} from the dashboard?`)) return;
    picked.delete(d);
    try {
      const response = await fetch(`${url}/bots/${encodeURIComponent(d)}`, { method: "DELETE", headers: rk ? { Authorization: `Bearer ${rk}` } : {} });
      if (!response.ok) $("#sum").textContent = `Delete failed: HTTP ${response.status}`;
    } catch {
      $("#sum").textContent = "Delete failed: relay unreachable";
    }
    return poll();
  }
  const n = e.target.dataset?.n;
  if (!n) return;
  e.target.checked ? picked.add(n) : picked.delete(n);
  render();
};
// Select all doubles as Unselect all once every visible bot is picked
$("#all").onclick = () => {
  const names = bots.filter(b => b.name.toLowerCase().includes($("#q").value.toLowerCase())).map(b => b.name);
  const every = names.length > 0 && names.every(n => picked.has(n));
  names.forEach(n => every ? picked.delete(n) : picked.add(n)); render();
};
// Bulk delete: removes every ticked bot from the relay in one go.
$("#delsel").onclick = async () => {
  const names = [...picked];
  if (!names.length || !await askDelete(`Delete ${names.length} selected bot(s) from the dashboard?`)) return;
  const results = await Promise.all(names.map(async n => {
    try {
      const response = await fetch(`${url}/bots/${encodeURIComponent(n)}`, { method: "DELETE", headers: rk ? { Authorization: `Bearer ${rk}` } : {} });
      return response.ok;
    } catch {
      return false;
    }
  }));
  picked.clear();
  await poll();
  if (results.some(ok => !ok)) $("#sum").textContent = `Some deletions failed (${results.filter(ok => !ok).length}); check that relay.py is running and configured correctly.`;
};
$("#q").oninput = render;
document.querySelectorAll("nav a").forEach(a => a.onclick = () => {
  tab = a.dataset.t; document.querySelectorAll("nav a").forEach(x => x.classList.toggle("on", x === a)); render();
});
$("#view").onclick = e => { const l = $("#grid").classList.toggle("list"); e.target.textContent = l ? "List View" : "Grid View"; };
// Streamer mode: on by default for privacy, then remembers your choice in this browser
const sm = localStorage.getItem("stream") !== "0";
$("#stream").checked = sm; document.body.classList.toggle("blur", sm);
$("#stream").onchange = e => { document.body.classList.toggle("blur", e.target.checked); localStorage.setItem("stream", e.target.checked ? "1" : "0"); };
$("#cfg").onclick = () => { $("#url").value = url; $("#rkin").value = rk; $("#dlg").showModal(); };
$("#save").onclick = () => { url = $("#url").value.trim().replace(/\/$/, ""); rk = $("#rkin").value.trim(); localStorage.setItem("relay", url); localStorage.setItem("rk", rk); $("#dlg").close(); poll(); };

poll();
// Keep a slow HTTP fallback for relays that do not support WebSockets (for example, a remote Worker).
setInterval(() => { if (!wsConnected) poll(); }, 5000);
</script></body></html>
